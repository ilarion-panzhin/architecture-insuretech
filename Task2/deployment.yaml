apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
      - name: test-app
        image: nginx:stable
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "10Mi"
          limits:
            memory: "15Mi"

